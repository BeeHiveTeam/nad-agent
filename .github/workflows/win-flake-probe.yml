# Measurement only, for issue #95. Runs the already-merged suite repeatedly on the same
# runner images CI uses, to get the flake rate and the loopback round-trip from the real
# environment rather than from a developer machine. Gates nothing.
name: win-flake-probe

on:
  push:
    branches: [ci/windows-flake-probe]
  workflow_dispatch:

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

      - name: measure
        shell: bash
        run: |
          out=results-${{ matrix.os }}.txt
          say() { echo "$@" | tee -a "$out" | tee -a "$GITHUB_STEP_SUMMARY"; }

          say "### ${{ matrix.os }} — node $(node -v)"
          say ""
          say "loopback round-trip, cold vs warm:"
          node probe/rtt.mjs 2>&1 | tee -a "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "wasCancelled against a socket that already closed:"
          node probe/closed.mjs 2>&1 | tee -a "$out" | tee -a "$GITHUB_STEP_SUMMARY"
          say ""
          say "20 runs of the full suite:"

          failed=0
          for i in $(seq 1 20); do
            run=$(npm test 2>&1) || true
            pass=$(printf '%s' "$run" | sed -n 's/^# pass \([0-9]*\)/\1/p')
            fail=$(printf '%s' "$run" | sed -n 's/^# fail \([0-9]*\)/\1/p')
            canc=$(printf '%s' "$run" | sed -n 's/^# cancelled \([0-9]*\)/\1/p')
            # grep exits 1 when nothing failed, and the job runs under `set -eo pipefail`,
            # so without this guard a clean run kills the probe instead of reporting it.
            bad=$(printf '%s' "$run" | grep -E '^ *not ok [0-9]+ - ' | sed 's/^ *not ok [0-9]* - //' | tr '\n' ';' || true)
            say "run $i: pass=${pass:-NO-REPORT} fail=${fail:-NO-REPORT} cancelled=${canc:-0} $bad"
            # A counter missing from the output means the run did not report, which is a
            # failure to observe — not a pass. Blank must never read as zero.
            if [ -z "$fail" ] || [ "$fail" != "0" ] || [ "${canc:-0}" != "0" ]; then
              failed=$((failed + 1))
            fi
          done
          say ""
          say "runs with a failure or no report: $failed of 20"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results-*.txt
